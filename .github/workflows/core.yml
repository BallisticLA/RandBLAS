name: core
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux / gcc / OpenBLAS — primary correctness cell (Release).
          - label: linux-gcc-openblas-release
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            blas-backend: openblas
            build-type: Release
            sanitizer: none
            openmp: true

          # Linux / gcc / OpenBLAS — Debug + ASan.
          - label: linux-gcc-openblas-debug-asan
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            blas-backend: openblas
            build-type: Debug
            sanitizer: asan
            openmp: true

          # Linux / gcc / OpenBLAS — Release + UBSan.
          - label: linux-gcc-openblas-release-ubsan
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            blas-backend: openblas
            build-type: Release
            sanitizer: ubsan
            openmp: true

          # Linux / gcc / MKL — exercises RandBLAS_HAS_MKL codepaths.
          - label: linux-gcc-mkl-release
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            blas-backend: mkl
            build-type: Release
            sanitizer: none
            openmp: true

          # Linux / clang / OpenBLAS — Release.
          - label: linux-clang-openblas-release
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            blas-backend: openblas
            build-type: Release
            sanitizer: none
            openmp: true

          # Linux / clang / OpenBLAS — Release + ASan.
          - label: linux-clang-openblas-release-asan
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            blas-backend: openblas
            build-type: Release
            sanitizer: asan
            openmp: true

          # macOS 14 / Apple Clang / Accelerate — no OpenMP (serial).
          - label: macos14-appleclang-accelerate-release
            os: macos-14
            cc: clang
            cxx: clang++
            blas-backend: accelerate
            build-type: Release
            sanitizer: none
            openmp: false

          # macOS 14 / Apple Clang / Accelerate — Debug + ASan, no OpenMP.
          - label: macos14-appleclang-accelerate-debug-asan
            os: macos-14
            cc: clang
            cxx: clang++
            blas-backend: accelerate
            build-type: Debug
            sanitizer: asan
            openmp: false

          # macOS 14 / Homebrew LLVM / Accelerate — OpenMP build.
          - label: macos14-llvm-accelerate-release
            os: macos-14
            cc: brew-llvm-clang
            cxx: brew-llvm-clang++
            blas-backend: accelerate
            build-type: Release
            sanitizer: none
            openmp: true

          # macOS 14 / Homebrew LLVM / Accelerate — Release + ASan with OpenMP.
          - label: macos14-llvm-accelerate-release-asan
            os: macos-14
            cc: brew-llvm-clang
            cxx: brew-llvm-clang++
            blas-backend: accelerate
            build-type: Release
            sanitizer: asan
            openmp: true

          # macOS 15 / Homebrew LLVM / Accelerate — track latest macOS runner.
          - label: macos15-llvm-accelerate-release
            os: macos-15
            cc: brew-llvm-clang
            cxx: brew-llvm-clang++
            blas-backend: accelerate
            build-type: Release
            sanitizer: none
            openmp: true

    steps:
      - uses: actions/checkout@v4

      - name: resolve compiler paths
        id: compilers
        shell: bash
        run: |
          set -euxo pipefail
          case "${{ matrix.cc }}" in
            brew-llvm-clang)
              brew update
              brew install llvm
              llvm_prefix="$(brew --prefix llvm)"
              echo "cc=${llvm_prefix}/bin/clang" >> "$GITHUB_OUTPUT"
              echo "cxx=${llvm_prefix}/bin/clang++" >> "$GITHUB_OUTPUT"
              echo "${llvm_prefix}/bin" >> "$GITHUB_PATH"
              ;;
            clang)
              if [[ "${{ runner.os }}" == "Linux" ]]; then
                sudo apt-get update -qq
                sudo apt-get install -qq -y clang
              fi
              echo "cc=clang" >> "$GITHUB_OUTPUT"
              echo "cxx=clang++" >> "$GITHUB_OUTPUT"
              ;;
            gcc)
              echo "cc=gcc" >> "$GITHUB_OUTPUT"
              echo "cxx=g++" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unknown matrix.cc: ${{ matrix.cc }}" >&2
              exit 1
              ;;
          esac

      - name: setup RandBLAS dependencies
        uses: ./.github/actions/setup-randblas-deps
        with:
          cc: ${{ steps.compilers.outputs.cc }}
          cxx: ${{ steps.compilers.outputs.cxx }}
          blas-backend: ${{ matrix.blas-backend }}

      - name: configure and build RandBLAS
        shell: bash
        env:
          CC: ${{ steps.compilers.outputs.cc }}
          CXX: ${{ steps.compilers.outputs.cxx }}
        run: |
          set -euxo pipefail
          cd ..
          mkdir -p RandBLAS-build
          cd RandBLAS-build

          sanitize_address_arg=""
          extra_cxx_flags=""
          extra_link_flags=""
          case "${{ matrix.sanitizer }}" in
            none) ;;
            asan)
              sanitize_address_arg="-DSANITIZE_ADDRESS=ON"
              ;;
            ubsan)
              extra_cxx_flags="-fsanitize=undefined -fno-sanitize-recover=undefined"
              extra_link_flags="-fsanitize=undefined"
              ;;
            *)
              echo "::error::unknown matrix.sanitizer: ${{ matrix.sanitizer }}" >&2
              exit 1
              ;;
          esac

          cmake \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DCMAKE_BUILD_TYPE="${{ matrix.build-type }}" \
            -DCMAKE_CXX_FLAGS="${extra_cxx_flags}" \
            -DCMAKE_EXE_LINKER_FLAGS="${extra_link_flags}" \
            ${sanitize_address_arg} \
            -Dblaspp_DIR="${blaspp_DIR}" \
            -DRandom123_DIR="${Random123_DIR}" \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/../RandBLAS-install" \
            "$(pwd)/../RandBLAS"

          if [[ "$(uname)" == "Darwin" ]]; then
            jobs="$(sysctl -n hw.logicalcpu)"
          else
            jobs="$(nproc)"
          fi
          make -j"${jobs}" install

      - name: ctest (OMP_NUM_THREADS=1)
        if: matrix.openmp
        shell: bash
        working-directory: ${{ github.workspace }}/../RandBLAS-build
        env:
          OMP_NUM_THREADS: "1"
        run: ctest --output-on-failure

      - name: ctest (OMP_NUM_THREADS=4)
        if: matrix.openmp
        shell: bash
        working-directory: ${{ github.workspace }}/../RandBLAS-build
        env:
          OMP_NUM_THREADS: "4"
        run: ctest --output-on-failure

      - name: ctest (no OpenMP)
        if: ${{ !matrix.openmp }}
        shell: bash
        working-directory: ${{ github.workspace }}/../RandBLAS-build
        run: ctest --output-on-failure

  windows-build:
    name: windows-msvc-mkl-ilp64-${{ matrix.label }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: openmp-release
            openmp: true
            sanitize_address: false
          - label: serial-release
            openmp: false
            sanitize_address: false
          - label: serial-release-asan
            openmp: false
            sanitize_address: true

    steps:
      - uses: actions/checkout@v4

      - name: initialize MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: setup native Windows dependencies
        uses: ./.github/actions/setup-randblas-deps-windows
        with:
          sanitize-address: ${{ matrix.sanitize_address }}

      - name: run native Windows core validation
        shell: pwsh
        run: |
          $openmp = '${{ matrix.openmp }}' -eq 'true'
          $sanitizeAddress = '${{ matrix.sanitize_address }}' -eq 'true'
          $task = if ($openmp) { "CoreOpenMP" } else { "CoreSerial" }
          $workName = if ($sanitizeAddress) { "$task-ASan" } else { $task }
          & "$env:GITHUB_WORKSPACE/.github/scripts/windows/run-ci.ps1" `
            -Task $task `
            -WorkRoot "$env:GITHUB_WORKSPACE/../RandBLAS-windows-ci-$workName" `
            -SanitizeAddress:$sanitizeAddress

  # User-fidelity lane: a plain Visual Studio install has no standalone
  # vcpkg -- only the manifest-only copy bundled with the C++ workload. A
  # classic-mode `vcpkg install` fails there ("this vcpkg distribution does
  # not have a classic mode instance") while staying green on CI runners,
  # which ship a classic-capable C:\vcpkg. This job hides the runner's
  # standalone vcpkg and provisions oneMKL through the bundled copy. The
  # vcpkg-installed tree is deliberately NOT cached so every run exercises
  # the manifest-mode fetch; only the installer download is cached.
  windows-vs-bundled-vcpkg:
    name: windows-msvc-mkl-ilp64-vs-bundled-vcpkg
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: initialize MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: cache oneMKL installer downloads
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\windows-deps-vsvcpkg\vcpkg-scratch\downloads
          key: windows-vsvcpkg-mkl-downloads-1-${{ hashFiles('.github/actions/setup-randblas-deps-windows/setup.ps1') }}

      - name: cache GoogleTest installation
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\windows-deps-vsvcpkg\googletest-install
          key: windows-vsvcpkg-googletest-1.17.0-1

      - name: cache BLAS++ installation
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\windows-deps-vsvcpkg\blaspp-install
          key: windows-vsvcpkg-blaspp-windows-portability-ilp64-sequential-3-${{ hashFiles('.github/actions/setup-randblas-deps-windows/setup.ps1') }}

      - name: run native Windows core validation
        shell: pwsh
        run: |
          Remove-Item Env:VCPKG_INSTALLATION_ROOT -ErrorAction SilentlyContinue
          Remove-Item Env:VCPKG_ROOT -ErrorAction SilentlyContinue
          $bundledVcpkg = Join-Path $env:VSINSTALLDIR "VC\vcpkg\vcpkg.exe"
          if (-not (Test-Path $bundledVcpkg)) {
            throw "Runner image has no VS-bundled vcpkg at $bundledVcpkg; this lane needs another way to reproduce a manifest-only vcpkg."
          }
          & "$env:GITHUB_WORKSPACE/.github/scripts/windows/run-ci.ps1" `
            -Task CoreSerial `
            -WorkRoot "$env:GITHUB_WORKSPACE/../RandBLAS-windows-ci-vsvcpkg" `
            -DependencyRoot "$env:GITHUB_WORKSPACE/../windows-deps-vsvcpkg" `
            -SetupDependencies `
            -VcpkgExecutable $bundledVcpkg
